[project]
name = "molstar-volseg"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "asgiref==3.5.0",
  "dask==2022.2.1",
  "fastapi==0.73.0",
  "gemmi==0.5.3",
  "matplotlib==3.5.1",
  "mrcfile==1.4.0",
  "numcodecs==0.9.1",
  "numpy",
  "pytest==7.1.2",
  "pytest-asyncio==0.18.3",
  "pytest-benchmark==3.4.1",
  "scikit-image==0.19.1",
  "scipy",
  "starfile",
  "starlette==0.17.1",
  "uvicorn==0.17.6",
  # with 0.59.1 produces warning
  "numba==0.58.1",
  # there were issues with version of this package
  # uncomment if without it it would not work
  # "vtk==9.0.3",
  "zarr==2.11.1",
  "dask-image",
  "pydantic",
  "ome-zarr",
  "jupyterlab",
  "mkdocs",
  "ciftools",
  "sfftk==0.5.5.dev1",
  "sfftk-rw==0.7.1",
  "SimpleParse",
  "tensorstore==0.1.72",
  "killport",
  "Pillow",
  "typer==0.7.0",
  "autoflake",
  "isort",
  "black",
  "pyometiff",
  "nibabel",
  "seaborn",
  "h5py",
  "vedo",
  "mkdocs-material",
  "cellstar-server",
  "cellstar-db",
  "cellstar-preprocessor",
  "cellstar-query",
  "ahds"
]

[tool.uv]
no-build-isolation-package = ["ahds", "sfftk"]

[[tool.uv.dependency-metadata]]
name = "ahds"
version = "0.2.4"
requires-dist = ["setuptools", "numpy"]

[tool.uv.sources]
ciftools = { git = "git+https://github.com/molstar/ciftools-python.git", rev = "b074526a8b418bc68d83ae5556a627d2d6ceabdb#egg=ciftools" }
SimpleParse = { git = "git+https://github.com/mcfletch/simpleparse.git", rev = "57c8d734bdc165581fbacfeecabe25a66c3452a4"}
cellstar-server = { workspace = true }
cellstar-db = { workspace = true }
cellstar-preprocessor = { workspace = true }
cellstar-query = { workspace = true }

[tool.uv.workspace]
members = ["server", "db", "preprocessor", "query"]
